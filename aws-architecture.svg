  <rect x="855" y="102" width="34" height="24" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <rect x="862" y="94" width="34" height="24" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="895" y="150" text-anchor="middle" font-size="13" fill="#1e1e1e">Amazon ECR</text>
  <text x="895" y="166" text-anchor="middle" font-size="10" fill="#7a4a10">Private image registry</text>

  <!-- IAM user -->
  <path d="M1030,94 Q1032,90 1038,92 L1160,90 Q1170,90 1168,98 L1170,158 Q1168,164 1160,162 L1038,164 Q1030,162 1032,154 Z"
