  <path d="M594,258 v-6 q0,-6 6,-6 q6,0 6,6 v6" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="655" y="272" text-anchor="middle" font-size="13" fill="#1e1e1e">SSH Deploy Step</text>

