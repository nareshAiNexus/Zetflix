  <circle cx="1085" cy="510" r="16" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <path d="M1069,510 h32 M1085,494 q10,16 0,32 M1085,494 q-10,16 0,32" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
