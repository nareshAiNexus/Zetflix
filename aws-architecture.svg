  <!-- Arrows -->
  <line x1="222" y1="124" x2="278" y2="124" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="462" y1="124" x2="518" y2="124" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="742" y1="128" x2="798" y2="128" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="1030" y1="132" x2="1002" y2="132" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="630" y1="174" x2="630" y2="238" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="630" y1="312" x2="630" y2="360" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="895" y1="174" x2="700" y2="408" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <line x1="960" y1="530" x2="998" y2="514" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="600" y="632" text-anchor="middle" font-size="13" fill="#495057">Push to main -&gt; build and test -&gt; push image to ECR -&gt; connect to EC2 -&gt; pull and restart containers via docker-compose</text>
</svg>
