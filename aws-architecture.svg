  <circle cx="600" cy="118" r="14" fill="none" stroke="#1e1e1e" stroke-width="2.2"/>
  <circle cx="600" cy="118" r="4" fill="#1e1e1e"/>
  <path d="M600,104 v4 M600,128 v4 M586,118 h4 M610,118 h4 M590,108 l3,3 M607,108 l-3,3 M590,128 l3,-3 M607,128 l-3,-3" stroke="#1e1e1e" stroke-width="2"/>
  <text x="655" y="123" text-anchor="middle" font-size="13" fill="#1e1e1e">GitHub Actions</text>
  <text x="630" y="150" text-anchor="middle" font-size="11" fill="#1c4e80">Build - Test - Dockerize</text>

  <!-- ECR -->
  <path d="M800,86 Q802,82 810,84 L990,82 Q1000,82 998,92 L1000,166 Q998,174 990,172 L810,174 Q800,172 802,162 Z"
