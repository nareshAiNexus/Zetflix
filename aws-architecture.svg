  <text x="1100" y="160" text-anchor="middle" font-size="9" fill="#5c2483">ECR push access</text>

  <!-- SSH deploy step -->
  <path d="M520,240 Q522,236 530,238 L730,236 Q740,236 738,244 L740,306 Q738,312 730,310 L530,312 Q520,310 522,302 Z"
