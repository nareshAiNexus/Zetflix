  <rect x="252" y="408" width="150" height="62" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2.2"/>
  <rect x="272" y="428" width="14" height="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="288" y="428" width="14" height="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="304" y="428" width="14" height="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <path d="M270,428 q30,-16 60,0" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="327" y="458" text-anchor="middle" font-size="12" fill="#1e1e1e">Docker Engine</text>

  <!-- docker-compose -->
  <rect x="422" y="408" width="150" height="62" rx="6" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2.2"/>
  <rect x="450" y="424" width="24" height="30" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="454" y1="430" x2="470" y2="430" stroke="#1e1e1e" stroke-width="1.3"/>
  <line x1="454" y1="436" x2="470" y2="436" stroke="#1e1e1e" stroke-width="1.3"/>
  <line x1="454" y1="442" x2="464" y2="442" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="497" y="458" text-anchor="middle" font-size="12" fill="#1e1e1e">docker-compose</text>

  <!-- IAM role -->
  <rect x="592" y="408" width="150" height="62" rx="6" fill="#e7c9f9" stroke="#1e1e1e" stroke-width="2.2"/>
  <circle cx="617" cy="435" r="7" fill="none" stroke="#1e1e1e" stroke-width="1.8"/>
  <line x1="624" y1="435" x2="638" y2="435" stroke="#1e1e1e" stroke-width="1.8"/>
  <line x1="632" y1="435" x2="632" y2="442" stroke="#1e1e1e" stroke-width="1.8"/>
  <text x="667" y="458" text-anchor="middle" font-size="11" fill="#1e1e1e">IAM Role (ECR pull)</text>

  <!-- Running containers row -->
  <rect x="252" y="486" width="640" height="88" rx="8" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
  <text x="572" y="508" text-anchor="middle" font-size="12" fill="#343a40">Running containers</text>

  <g font-size="10" fill="#343a40" text-anchor="middle">
    <rect x="278" y="518" width="46" height="34" rx="4" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="301" y="562">content</text>

    <rect x="336" y="518" width="46" height="34" rx="4" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="359" y="562">video</text>

    <rect x="394" y="518" width="46" height="34" rx="4" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="417" y="562">encoding</text>

    <rect x="452" y="518" width="46" height="34" rx="4" fill="#99e9f2" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="475" y="562">streaming</text>

    <rect x="510" y="518" width="46" height="34" rx="4" fill="#96f2d7" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="533" y="562">mysql</text>

    <rect x="568" y="518" width="46" height="34" rx="4" fill="#ffa8a8" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="591" y="562">redis</text>

    <rect x="626" y="518" width="46" height="34" rx="4" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="649" y="562">kafka+zk</text>

    <rect x="684" y="518" width="46" height="34" rx="4" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
    <text x="707" y="562">frontend</text>
  </g>

  <!-- User browser -->
  <path d="M1000,486 Q1002,482 1010,484 L1160,482 Q1170,482 1168,492 L1170,552 Q1168,558 1160,556 L1010,558 Q1000,556 1002,548 Z"
