<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Comic Sans MS, Segoe Print, cursive">
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#1e1e1e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" fill="#1e1e1e">Zetflix - AWS Deployment and CI/CD Pipeline</text>

  <!-- Developer -->
  <path d="M40,92 Q42,88 48,90 L212,88 Q222,88 220,96 L222,156 Q220,162 212,160 L48,162 Q40,160 42,152 Z"
        fill="#e9ecef" stroke="#1e1e1e" stroke-width="2.5"/>
  <circle cx="130" cy="112" r="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <path d="M112,138 q18,-16 36,0" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" font-size="12" fill="#1e1e1e">git push (main)</text>

  <!-- GitHub repo -->
  <path d="M280,92 Q282,88 288,90 L452,88 Q462,88 460,96 L462,156 Q460,162 452,160 L288,162 Q280,160 282,152 Z"
